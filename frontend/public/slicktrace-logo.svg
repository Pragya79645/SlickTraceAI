<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 28" width="196" height="28" role="img" aria-label="SlickTrace AI">
  <!-- radar ring -->
  <circle cx="14" cy="14" r="11.5" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity="0.55"/>
  <circle cx="14" cy="14" r="6.5" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  <!-- slick -->
  <ellipse cx="14" cy="14.5" rx="8.2" ry="3.4" transform="rotate(-24 14 14.5)" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="17.4" cy="12.4" rx="2.6" ry="1.5" transform="rotate(-24 17.4 12.4)" fill="#fcd34d"/>
  <!-- sweep tick -->
  <path d="M14 14 L23.5 6.6" stroke="#fcd34d" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- wordmark -->
  <text x="36" y="19.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" letter-spacing="-0.4" fill="#ffffff">SlickTrace</text>
  <text x="152" y="19.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="300" fill="#f59e0b">AI</text>
</svg>
